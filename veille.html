<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Veille Technologique IoT – Dossier Complet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons pour quelques icônes -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    :root {
      --accent: #22f2b8;
      --accent-soft: rgba(34, 242, 184, 0.25);
      --bg-deep: #020617;
    }

    * {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: black;
      color: white;
    }

    /* ========= FOND MATRIX ========= */
    #matrix-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -50;
      background: black;
    }

    .matrix-overlay {
      position: fixed;
      inset: 0;
      z-index: -40;
      pointer-events: none;
      background:
        radial-gradient(circle at 0% 0%, rgba(34, 242, 184, 0.21), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.18), transparent 55%),
        radial-gradient(circle at 50% 0%, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.98));
      mix-blend-mode: screen;
    }

    /* ========= HEADER STICKY ========= */
    .app-header {
      backdrop-filter: blur(22px);
      background: radial-gradient(circle at top left, rgba(34, 242, 184, 0.07), rgba(2, 6, 23, 0.98));
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
    }

    /* ========= TITRE PRINCIPAL ========= */
    .title-main {
      text-shadow: 0 0 18px rgba(34, 242, 184, 0.5);
      transition: color 0.35s ease, text-shadow 0.35s ease, transform 0.35s ease;
      color: rgba(34, 242, 184, 0.8);
    }

    .title-main:hover {
      color: rgb(34, 242, 184);
      text-shadow: 0 0 30px rgba(34, 242, 184, 1);
      transform: scale(1.02);
    }

    /* ========= PANELS / CARTES ========= */
    .panel-deep {
      background: radial-gradient(circle at top left, rgba(34, 242, 184, 0.1), transparent 60%),
                  radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 1));
      border-radius: 1.5rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow:
        0 0 0 1px rgba(15, 23, 42, 0.9),
        0 30px 80px rgba(0, 0, 0, 0.95),
        0 0 60px rgba(34, 242, 184, 0.12);
    }

    .panel-soft {
      border-radius: 1.25rem;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(51, 65, 85, 0.9);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(15, 23, 42, 0.8);
    }

    .card-hover {
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease, background 0.35s ease;
    }

    .card-hover:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow:
        0 22px 55px rgba(0, 0, 0, 0.95),
        0 0 40px rgba(34, 242, 184, 0.16);
      border-color: rgba(34, 242, 184, 0.9);
      background: radial-gradient(circle at top left, rgba(34, 242, 184, 0.15), rgba(15, 23, 42, 1));
    }

    /* ========= CONTEXTE : VIDÉO ========= */
    .context-video-wrapper {
      position: relative;
      overflow: hidden;
    }

    .context-video-wrapper video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.35) saturate(1.15) blur(1px);
      transform: scale(1.05);
    }

    .context-video-overlay {
      position: relative;
      z-index: 10;
      backdrop-filter: blur(14px);
      background: radial-gradient(circle at top left, rgba(34, 242, 184, 0.32), rgba(1, 4, 15, 0.9));
    }

    /* ========= ICONES ========= */
    .iot-tool-icon {
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .iot-tool:hover .iot-tool-icon {
      transform: scale(1.35) translateY(-2px);
      filter: drop-shadow(0 0 18px rgba(34, 242, 184, 0.95));
    }

    /* ========= MARQUEE ========= */
    .marquee {
      position: relative;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
    }
    .marquee-track {
      display: inline-flex;
      gap: 3rem;
      white-space: nowrap;
      animation: marquee 30s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ========= TABLE ========= */
    .table-shell {
      background: radial-gradient(circle at top left, rgba(34, 242, 184, 0.06), #020617);
      border-radius: 1.5rem;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.9);
    }

    /* ========= ANIMATIONS ========= */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      filter: blur(2px);
      transition:
        opacity 0.7s ease-out,
        transform 0.7s ease-out,
        filter 0.7s ease-out;
    }

    .reveal-active {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .badge-pill {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      padding: 0.25rem 0.85rem;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.65);
      border-radius: 999px;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      bottom: -0.25rem;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #22f2b8, #38bdf8);
      transition: width 0.25s ease;
    }

    .nav-link:hover::after,
    .nav-link.nav-active::after {
      width: 100%;
    }
  </style>
</head>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veille Technologique - Objets Connectés (IoT)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* ===== FOND MATRIX + OBJETS IOT ANIMÉS ===== */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
      background: #000;
      color: #e9ecef;
      font-family: system-ui, -apple-system, sans-serif;
    }

    canvas#matrix {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      opacity: 0.15;
    }

    .iot-rain {
      position: fixed;
      top: -100px;
      font-size: 2.5rem;
      opacity: 0.4;
      pointer-events: none;
      z-index: -1;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to { transform: translateY(100vh + 100px); }
    }

    /* Contenu par-dessus le fond animé */
    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(2px);
    }

    .header-custom {
      background: linear-gradient(135deg, #001a00, #004d00);
      padding: 5rem 0;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,255,0,0.2);
    }

    h1, h2 { color: #0f0; text-shadow: 0 0 15px #0f0; }
    h2::after { background: #0f0; }
  </style>
</head>
<body>

  <!-- Pluie Matrix -->
  <canvas id="matrix"></canvas>

  <!-- Icônes IoT qui tombent -->
  <div class="iot-rain" style="left: 5%; animation-duration: 12s; animation-delay: 0s;">Router</div>
  <div class="iot-rain" style="left: 15%; animation-duration: 18s; animation-delay: 2s;">Smart Bulb</div>
  <div class="iot-rain" style="left: 25%; animation-duration: 15s; animation-delay: 5s;">Camera</div>
  <div class="iot-rain" style="left: 35%; animation-duration: 20s; animation-delay: 1s;">Thermostat</div>
  <div class="iot-rain" style="left: 48%; animation-duration: 14s; animation-delay: 8s;">Lock</div>
  <div class="iot-rain" style="left: 60%; animation-duration: 17s; animation-delay: 3s;">Watch</div>
  <div class="iot-rain" style="left: 72%; animation-duration: 22s; animation-delay: 6s;">Sensor</div>
  <div class="iot-rain" style="left: 85%; animation-duration: 16s; animation-delay: 4s;">Speaker</div>
  <div class="iot-rain" style="left: 92%; animation-duration: 19s; animation-delay: 7s;">Hub</div>

  <div class="content">
    <header class="header-custom">
      <div class="container">
        <h1 class="display-3 fw-bold">VEILLE TECHNOLOGIQUE</h1>
        <p class="lead fs-2">Objets Connectés & IoT – 2025</p>
      </div>
    </header>

    <main class="container my-5 text-light">
      <!-- Ton contenu actuel (intro, outils, articles, tableau…) -->
      <!-- Je te remets juste un exemple propre, tu colles le reste de ton contenu ici 
      
      <section class="my-5 p-4 bg-dark bg-opacity-75 rounded">
        <h2 class="text-center mb-5">Contexte & Objectifs</h2>
        <p class="lead text-center">Cette veille explore l’explosion des objets connectés en 2025 : Matter 1.3, Edge AI, sécurité, 5G/6G, villes intelligentes, etc.</p>
      </section>

      Tu colles ici tout le reste de ton ancien contenu (méthodologie, articles, tableau… 
      (je peux te le réintégrer entièrement si tu veux)

    </main>
  </div>

  <!-- Script Matrix + chute d'icônes IoT -->
  <script>
    // Pluie Matrix
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#€£¥§±¶∆∞µλΩ";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = matrix[Math.floor(Math.random() * matrix.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
          drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(draw, 35);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Comptes rendus – Clément Casse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Space Grotesk", sans-serif;
    }

    .panel {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 1.2rem;
      padding: 1.5rem;
      transition: .25s;
    }
    .panel:hover {
      border-color: #22f2b8;
      background: rgba(34, 242, 184, 0.08);
      box-shadow: 0 0 25px rgba(34, 242, 184, .3);
    }

    .reveal {
      opacity: 0;
      transform: translateY(25px);
      transition: .6s ease;
    }
    .reveal-active {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body class="px-6 py-10">

  <!-- HEADER -->
  <header class="max-w-5xl mx-auto mb-10">
    <a href="index.html" class="text-emerald-300 text-sm hover:underline">
      ← Retour au portfolio
    </a>

    <h1 class="text-4xl font-semibold mt-4 text-emerald-300">
      Comptes rendus & Documents
    </h1>
  </header>

  <!-- DOCUMENT LIST -->
  <main class="max-w-5xl mx-auto space-y-4">

    <!-- [... TOUS LES AUTRES BLOCS SONT IDENTIQUES ...] -->

    <!-- 🔥 ATELIER 14 AVEC BOUTON À DROITE -->
    <div class="panel reveal mb-20">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

        <div>
          <h2 class="text-lg font-semibold">Atelier 14 : Javascript</h2>
          <a href="Atelier14.pdf" target="_blank" class="text-emerald-300 underline">
            Ouvrir le document
          </a>
        </div>

        <a
          href="atelier14.html"
          target="_blank"
          class="inline-block px-5 py-2 rounded-lg bg-emerald-400 text-black font-medium
                 hover:bg-emerald-300 transition shadow-md whitespace-nowrap"
        >
          Accès à la page HTML de l’atelier 14
        </a>

      </div>
    </div>

    <!-- [... LES BLOCS SUIVANTS RESTENT IDENTIQUES ...] -->

    <div class="panel reveal mb-20">
      <h2 class="text-lg font-semibold">Recherche avancée Google</h2>
      <a href="rechecheavance.pdf" target="_blank" class="text-emerald-300 underline">Ouvrir</a>
    </div>

    <div class="panel reveal mb-20">
      <h2 class="text-lg font-semibold">TH2 : CH3 : TD2 VM Email M@Banque</h2>
      <a href="thunder.pdf" target="_blank" class="text-emerald-300 underline">Ouvrir</a>
    </div>

    <div class="panel reveal mb-20">
      <h2 class="text-lg font-semibold">TH3 : CH4 : TD1 VM Kali Linux</h2>
      <a href="TH3CH4.pdf" target="_blank" class="text-emerald-300 underline">Ouvrir</a>
    </div>

  </main>

  <!-- REVEAL SCRIPT -->
  <script>
    const reveals = document.querySelectorAll(".reveal");
    const obs = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add("reveal-active");
      });
    }, { threshold: 0.2 });

    reveals.forEach(el => obs.observe(el));
  </script>

</body>
</html>
